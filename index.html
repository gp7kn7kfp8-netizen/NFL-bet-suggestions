                    month: 'short',

            if (selectedMultiGames.includes(id)) {

            renderMultiGameSelector();
        }

                    item.className = "bg-slate-900/90 border border-slate-700/60 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3";
                    item.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded font-bold border border-emerald-500/30">${news.tag}</span>
                                <span class="text-xs text-slate-400">${news.time} &bull; ${news.source}</span>
                            </div>
                            <h4 class="text-sm font-semibold text-slate-100">${news.title}</h4>
                        </div>
                    `;
                    newsContainer.appendChild(item);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderBets('ALL');
        });
    </script>
</body>
</html>
