        async function fetchSleeperState() {
            try {
                const response = await fetch('https://api.sleeper.app/v1/state/nfl');
                const data = await response.json();
                if (data && data.week) {
                    document.getElementById('nflWeekBadge').innerText = `UK Time • Season ${data.season} Week ${data.week}`;
                }
            } catch (e) {
                console.log('Sleeper state fallback active.');
            }
        }

        async function fetchSleeperTrending() {
            const container = document.getElementById('sleeperNewsContainer');
            if (!container) return;
            try {
                const response = await fetch('https://api.sleeper.app/v1/players/nfl/trending/add?limit=5');
                const trendingPlayers = await response.json();
                
                if (trendingPlayers && trendingPlayers.length > 0) {
                    container.innerHTML = '';
                    trendingPlayers.forEach((item, idx) => {
                        const div = document.createElement('div');
                        div.className = "bg-slate-900/90 border border-slate-700/60 rounded-xl p-4 flex justify-between items-center";
                        div.innerHTML = `
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded font-bold border border-emerald-500/30">Trending Add</span>
                                    <span class="text-xs text-slate-400">Rank #${idx + 1} &bull; Sleeper API</span>
                                </div>
                                <h4 class="text-sm font-semibold text-slate-100">Player ID: ${item.player_id} added by ${item.count} fantasy managers today.</h4>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (e) {
                container.innerHTML = `<p class="text-slate-400 text-sm italic">Unable to load live trending feed right now.</p>`;
            }
        }

        function formatUKDateTime(dateString) {
            try {
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('en-GB', {
                    timeZone: 'Europe/London',
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZoneName: 'short'
                }).format(date);
            } catch (e) {
                return dateString;
            }

            if (tab === 'gamedays') selectGameDay(currentGameDay);
            if (tab === 'schedule') {
                renderScheduleAndNews();

            }

                    selectedMultiGames.shift();
                }
                selectedMultiGames.push(id);
            }
            renderMultiGameSelector();
        }

        function updateMultiGameResult() {
            const resultContainer = document.getElementById('multiGameResult');
            if (!resultContainer) return;
            if (selectedMultiGames.length < 2) {
                resultContainer.innerHTML = `<p class="text-slate-400 text-sm italic"><i class="fa-solid fa-triangle-exclamation text-amber-400 mr-1"></i> Please select exactly 2 games above to generate your cross-match parlay slip (${selectedMultiGames.length}/2 selected).</p>`;
                return;
            }

            const game1 = suggestedBetsData.find(b => b.id === selectedMultiGames[0]);
            const game2 = suggestedBetsData.find(b => b.id === selectedMultiGames[1]);

            resultContainer.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
                        <div>
                            <span class="text-xs text-emerald-400 font-bold">Combined Cross-Match Bet</span>
                            <div class="text-sm font-bold text-white">Estimated Combined Odds: <span class="text-emerald-400">11/4 (3.75)</span></div>
                        </div>
                        <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-500/35 font-bold">Under 3/1 Cap</span>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700/80">
                            <span class="text-xs font-bold text-emerald-400 block mb-1">Leg 1 (${game1.awayTeam} @ ${game1.homeTeam}):</span>
                            <div class="text-xs text-slate-200 font-semibold">• ${game1.legs[0]}</div>
                        </div>
                        <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700/80">
                            <span class="text-xs font-bold text-emerald-400 block mb-1">Leg 2 (${game2.awayTeam} @ ${game2.homeTeam}):</span>
                            <div class="text-xs text-slate-200 font-semibold">• ${game2.legs[0]}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderScheduleAndNews() {
            const schedContainer = document.getElementById('scheduleContainer');
            if (schedContainer && schedContainer.children.length === 0) {
                scheduleData.forEach(game => {
                    const ukTime = formatUKDateTime(game.rawDate);
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-emerald-400">${ukTime}</span>
                                <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-300">${game.day}</span>
                            </div>
                            <div class="text-sm font-bold text-white mt-1 flex items-center gap-1.5 flex-wrap">
                                <img src="${game.awayLogo}" class="w-5 h-5 object-contain" alt=""> ${game.away} @ <img src="${game.homeLogo}" class="w-5 h-5 object-contain" alt=""> ${game.home}
                            </div>
                            <div class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-location-dot mr-1"></i> ${game.venue}</div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                            <span>Status: Upcoming</span>
                            <span class="text-emerald-400 font-semibold">UK Synced</span>
                        </div>
                    `;
                    schedContainer.appendChild(card);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchSleeperState();
            renderBets('ALL');
        });
    </script>
</body>
</html>
